name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag suffix. Defaults to the commit SHA.
        required: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ github.event.inputs.image_tag }}"
          if [[ -z "$suffix" ]]; then
            suffix="sha-${GITHUB_SHA}"
          fi
          echo "image=${IMAGE_NAME}:${suffix}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_HOST: ${{ vars.WXC_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.WXC_DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.WXC_DEPLOY_PATH }}
      PUBLIC_HOST: ${{ vars.WXC_PUBLIC_HOST }}
      DATA_DIR: ${{ vars.WXC_DATA_DIR || './data' }}
      SCHEDULER_INTERVAL: ${{ vars.WXC_SCHEDULER_INTERVAL || '120' }}
      SCHEDULER_PAGES: ${{ vars.WXC_SCHEDULER_PAGES || '2' }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Validate deployment config
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in IMAGE DEPLOY_HOST DEPLOY_USER DEPLOY_PATH PUBLIC_HOST DATA_DIR SCHEDULER_INTERVAL SCHEDULER_PAGES; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required deployment config: %s\n' "${missing[*]}" >&2
            exit 2
          fi

          for name in IMAGE DEPLOY_HOST DEPLOY_USER DEPLOY_PATH PUBLIC_HOST DATA_DIR SCHEDULER_INTERVAL SCHEDULER_PAGES; do
            if [[ "${!name}" =~ [[:space:]] ]]; then
              printf 'Deployment config %s must not contain whitespace.\n' "$name" >&2
              exit 2
            fi
          done

          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]; then
            echo "WXC_DEPLOY_USER must be a simple SSH username." >&2
            exit 2
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "WXC_DEPLOY_PATH must be an absolute path using only letters, numbers, dots, dashes, underscores, and slashes." >&2
            exit 2
          fi
          if [[ ! "$DATA_DIR" =~ ^(\./[A-Za-z0-9._/-]+|/[A-Za-z0-9._/-]+)$ ]]; then
            echo "WXC_DATA_DIR must be ./relative or absolute and use only letters, numbers, dots, dashes, underscores, and slashes." >&2
            exit 2
          fi
          if [[ ! "$SCHEDULER_INTERVAL" =~ ^[0-9]+$ || ! "$SCHEDULER_PAGES" =~ ^[0-9]+$ ]]; then
            echo "WXC_SCHEDULER_INTERVAL and WXC_SCHEDULER_PAGES must be positive integers." >&2
            exit 2
          fi
          if (( 10#$SCHEDULER_INTERVAL < 1 || 10#$SCHEDULER_PAGES < 1 )); then
            echo "WXC_SCHEDULER_INTERVAL and WXC_SCHEDULER_PAGES must be greater than zero." >&2
            exit 2
          fi
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.WXC_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.WXC_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_SSH_KEY" ]]; then
            echo "Missing required secret WXC_DEPLOY_SSH_KEY." >&2
            exit 2
          fi
          if [[ -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "Missing required secret WXC_DEPLOY_KNOWN_HOSTS." >&2
            exit 2
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/wxc-cfzh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/wxc-cfzh
          chmod 600 ~/.ssh/known_hosts
      - name: Prepare deployment environment
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'WXC_IMAGE=%s\n' "$IMAGE"
            printf 'WXC_PUBLIC_HOST=%s\n' "$PUBLIC_HOST"
            printf 'WXC_DATA_DIR=%s\n' "$DATA_DIR"
            printf 'WXC_SCHEDULER_INTERVAL=%s\n' "$SCHEDULER_INTERVAL"
            printf 'WXC_SCHEDULER_PAGES=%s\n' "$SCHEDULER_PAGES"
          } > deploy.env
      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/wxc-cfzh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          deploy_path="${DEPLOY_PATH%/}"
          if [[ "$DATA_DIR" == ./* ]]; then
            data_path="${deploy_path}/${DATA_DIR#./}"
          else
            data_path="$DATA_DIR"
          fi
          printf -v quoted_deploy_path '%q' "$deploy_path"
          printf -v quoted_data_path '%q' "$data_path"

          ssh "${ssh_opts[@]}" "$target" "mkdir -p $quoted_deploy_path $quoted_data_path"
          scp "${ssh_opts[@]}" docker-compose.yml Caddyfile deploy.env "$target:$deploy_path/"
          ssh "${ssh_opts[@]}" "$target" "mv $quoted_deploy_path/deploy.env $quoted_deploy_path/.env"
      - name: Deploy image
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/wxc-cfzh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          deploy_path="${DEPLOY_PATH%/}"
          printf -v quoted_deploy_path '%q' "$deploy_path"

          ssh "${ssh_opts[@]}" "$target" \
            "cd $quoted_deploy_path && docker compose config && docker compose pull && docker compose up -d && docker image prune -f && docker compose ps"
      - name: Check remote container health
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/wxc-cfzh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          deploy_path="${DEPLOY_PATH%/}"
          printf -v quoted_deploy_path '%q' "$deploy_path"
          health_cmd='import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/api/health", timeout=5)'

          ssh "${ssh_opts[@]}" "$target" \
            "cd $quoted_deploy_path && for attempt in \$(seq 1 30); do if docker compose exec -T web python -c '$health_cmd' >/dev/null 2>&1; then echo 'container health check passed'; exit 0; fi; sleep 2; done; docker compose logs --tail 80 web proxy; exit 1"
      - name: Check public health
        shell: bash
        run: |
          set -euo pipefail
          public_url="${PUBLIC_HOST%/}"
          if [[ "$public_url" != http://* && "$public_url" != https://* ]]; then
            public_url="https://${public_url}"
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$public_url/api/health" >/dev/null; then
              echo "public health check passed"
              exit 0
            fi
            sleep 5
          done

          curl --fail --show-error "$public_url/api/health"
