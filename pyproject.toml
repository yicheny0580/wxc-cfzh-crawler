[project]
name = "wxc-cfzh-workspace"
version = "0.1.0"
description = "Workspace for the WXC CFZH crawler, inspector, and local data."
requires-python = ">=3.13"
dependencies = [
    "wxc-cfzh-crawler",
    "wxc-cfzh-inspector-backend",
]

[tool.uv]
package = false

[tool.uv.sources]
wxc-cfzh-crawler = { workspace = true }
wxc-cfzh-inspector-backend = { workspace = true }

[tool.uv.workspace]
members = [
    "crawler",
    "inspector/backend",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.wxc.file_lines]
max_lines = 400
include = [
    "crawler/src/**/*.py",
    "inspector/backend/app/**/*.py",
    "inspector/frontend/src/**/*.css",
    "inspector/frontend/src/**/*.ts",
    "inspector/frontend/src/**/*.tsx",
]
exclude = [
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/tests/**",
]
