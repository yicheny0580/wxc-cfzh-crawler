[project]
name = "wxc-cfzh-crawler"
version = "0.1.0"
description = "Local-first crawler for Wenxuecity cfzh forum posts and nested replies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "scrapy>=2.14,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wxc_cfzh_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
